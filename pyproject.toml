[project]
name = "leanwarp-sdk"
version = "0.1.0"
description = "LeanWarp hosted proof workspaces for Python, CLI and MCP agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["httpcore>=1.0.9,<2", "httpx>=0.28.1,<1", "mcp>=1.28.1,<2"]

[project.optional-dependencies]
test = ["pytest>=8.4,<10"]

[project.scripts]
leanwarp = "leanwarp_cloud.cli:main"

[project.urls]
Repository = "https://github.com/Isagoge-Labs/LeanWarp-SDK"
Homepage = "https://isagoge.in"
Documentation = "https://github.com/Isagoge-Labs/LeanWarp-SDK/blob/main/docs/README.md"

[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leanwarp_cloud"]


[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/examples", "/README.md", "/LICENSE", "/pyproject.toml", "/.gitignore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
